name: deploy

# SPEC §13.1. The only way LabKit is deployed:
#   push to main           → staging
#   v* tag on a main commit → production (the `production` environment requires approval)
# `build` builds and signs; `deploy` ships that exact signed build, then reads it back from
# Cloudflare and checks it (results are in this run's public log).
# To re-check a live deployment without deploying, run verify.yml.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Sigstore signing certificate
      attestations: write
    outputs:
      env: ${{ steps.env.outputs.env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # to check a release tag is on main
          persist-credentials: false
      - name: Choose environment
        id: env
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$GITHUB_REF_NAME is not a commit on main"
              exit 1
            fi
            echo env=production >> "$GITHUB_OUTPUT"
          else
            echo env=staging >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      # No dependency cache: a release build starts from the lockfile alone.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Install the official SHC validator
        run: bash scripts/setup-validator.sh
      # Throwaway local key for the tests' dev Worker (never a staging/production key).
      - run: pnpm gen-key --env dev
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build release
        run: pnpm build:release --env "$DEPLOY_ENV"
        env:
          DEPLOY_ENV: ${{ steps.env.outputs.env }}
      - name: Sign the Worker bundle and build manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/${{ steps.env.outputs.env }}/worker/index.js
            out/${{ steps.env.outputs.env }}/build-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.env.outputs.env }}
          path: out/${{ steps.env.outputs.env }}
          if-no-files-found: error
          retention-days: 90

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ needs.build.outputs.env }}
      url: ${{ needs.build.outputs.env == 'production' && 'https://labkit.health' || 'https://staging.labkit.health' }}
    concurrency:
      group: deploy-${{ needs.build.outputs.env }}
      cancel-in-progress: false
    permissions:
      contents: read
      attestations: read
    env:
      DEPLOY_ENV: ${{ needs.build.outputs.env }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.build.outputs.env }}
          path: out/${{ needs.build.outputs.env }}
      - name: Verify the build's signatures
        run: |
          for f in "out/$DEPLOY_ENV/worker/index.js" "out/$DEPLOY_ENV/build-manifest.json"; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/deploy.yml" \
              --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
      - name: Deploy the signed build unchanged
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          rm -rf apps/web/dist
          cp -R "out/$DEPLOY_ENV/web" apps/web/dist
          # --config is required: given an entry path, Wrangler otherwise looks for its config
          # next to that file and deploys with no bindings, assets or routes.
          pnpm --filter @labkit/worker exec wrangler deploy "$GITHUB_WORKSPACE/out/$DEPLOY_ENV/worker/index.js" \
            --config wrangler.toml --no-bundle --env "$DEPLOY_ENV" \
            --tag "$GITHUB_SHA" --message "$GITHUB_REF_NAME, run $GITHUB_RUN_ID"
      - run: pnpm smoke --env "$DEPLOY_ENV"
      - name: Check the live deployment against the signed build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm verify:deployment --env "$DEPLOY_ENV" --repo "$GITHUB_REPOSITORY" --expect "out/$DEPLOY_ENV/build-manifest.json"
