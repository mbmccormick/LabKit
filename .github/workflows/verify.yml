name: verify

# SPEC §13.1. Re-checks a live deployment against its signed build without deploying
# (Actions → verify → Run workflow, from main): the same checks the deploy job runs after
# each deploy, including reading the deployed Worker back from Cloudflare.
on:
  workflow_dispatch:
    inputs:
      env:
        description: Deployment to check
        type: choice
        options: [staging, production]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.env }}
    permissions:
      contents: read
      attestations: read
    env:
      DEPLOY_ENV: ${{ inputs.env }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Check the live deployment against its signed build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm verify:deployment --env "$DEPLOY_ENV" --repo "$GITHUB_REPOSITORY"
