name: verify

# SPEC §13.1. Re-checks a live deployment against its signed build without deploying
# (Actions → verify → Run workflow, from main): the same checks the deploy job runs after
# each deploy, including reading the deployed Worker back from Cloudflare.
on:
  workflow_dispatch:
    inputs:
      env:
        description: Deployment to check
        type: choice
        options: [staging, production]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.env }}
    permissions:
      contents: read
      attestations: read
    env:
      DEPLOY_ENV: ${{ inputs.env }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Check the live deployment against its signed build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm verify:deployment --env "$DEPLOY_ENV" --repo "$GITHUB_REPOSITORY"
